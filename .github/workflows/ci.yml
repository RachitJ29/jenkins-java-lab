name: AI-Assisted Java CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compile Application and Test
        run: |
          javac Main.java
          javac MainTest.java
      - name: Automated Code Quality Test
        run: java MainTest

      - name: Run Application
        run: java Main
